# Deliberately node-affine persistent workspace for the single GPU node.
# It stores only regenerable training data/checkpoints; NAS remains the off-host artifact tier.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: g3-gpu-training
  labels:
    lab.home.arpa/tier: gpu-local
    lab.home.arpa/purpose: training-workspace
spec:
  capacity:
    storage: 80Gi
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /srv/training/volumes/gpu-training
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [g3]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gpu-training-workspace
  namespace: ai
  labels:
    lab.home.arpa/purpose: gpu-training
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: g3-gpu-training
  resources:
    requests:
      storage: 80Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-pytorch-smoke
  namespace: ai
  labels:
    app: gpu-pytorch-smoke
    lab.home.arpa/experiment: cuda-training-smoke
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: gpu-pytorch-smoke
        lab.home.arpa/experiment: cuda-training-smoke
    spec:
      restartPolicy: Never
      nodeSelector:
        lab.home.arpa/gpu-node: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        fsGroup: 1000
      containers:
        - name: pytorch
          image: docker.io/pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          resources:
            requests:
              cpu: "4"
              memory: 12Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "6"
              memory: 16Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          command: [python, -c]
          args:
            - |
              import json, time, torch
              assert torch.cuda.is_available(), 'CUDA was not exposed to the pod'
              torch.manual_seed(7)
              device = torch.device('cuda:0')
              model = torch.nn.Sequential(torch.nn.Linear(2048, 2048), torch.nn.ReLU(), torch.nn.Linear(2048, 10)).to(device)
              optimizer = torch.optim.AdamW(model.parameters(), lr=1e-3)
              start = time.perf_counter()
              for step in range(25):
                  x = torch.randn(64, 2048, device=device)
                  y = torch.randint(0, 10, (64,), device=device)
                  loss = torch.nn.functional.cross_entropy(model(x), y)
                  optimizer.zero_grad(set_to_none=True); loss.backward(); optimizer.step()
              torch.cuda.synchronize()
              result = {
                  'torch': torch.__version__, 'cuda': torch.version.cuda,
                  'gpu': torch.cuda.get_device_name(0), 'steps': 25,
                  'loss': float(loss.detach().cpu()), 'elapsed_seconds': round(time.perf_counter()-start, 3),
                  'max_memory_bytes': int(torch.cuda.max_memory_allocated()),
              }
              open('/workspace/pytorch-smoke-result.json', 'w').write(json.dumps(result, indent=2) + '\n')
              print(json.dumps(result, sort_keys=True))
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: gpu-training-workspace
