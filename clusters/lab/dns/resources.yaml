apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-dns
  namespace: dns-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lab-dns-discovery
rules:
- apiGroups: [""]
  resources: [endpoints, services, pods, namespaces]
  verbs: [list, watch]
- apiGroups: [discovery.k8s.io]
  resources: [endpointslices]
  verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lab-dns-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lab-dns-discovery
subjects:
- kind: ServiceAccount
  name: lab-dns
  namespace: dns-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-dns
  namespace: dns-system
data:
  Corefile: |
    .:53 {
        errors
        health :8080
        ready :8181
        prometheus :9153
        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods disabled
            fallthrough in-addr.arpa ip6.arpa
        }
        k8s_external lab.home.arpa {
            ttl 30
        }
        hosts {
            192.168.1.3 k8s.lab.home.arpa o-3090-01.lab.home.arpa pxe.lab.home.arpa
            192.168.1.4 o-3090-02.lab.home.arpa
            192.168.1.107 nas.lab.home.arpa
            192.168.1.1 gateway.lab.home.arpa
            fallthrough
        }
        forward . 192.168.1.1
        cache 30
        loop
        reload
        loadbalance
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-dns
  namespace: dns-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lab-dns
  template:
    metadata:
      labels:
        app: lab-dns
    spec:
      serviceAccountName: lab-dns
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: lab-dns
      containers:
      - name: coredns
        image: coredns/coredns:1.14.7
        args: [-conf, /etc/coredns/Corefile]
        ports:
        - {name: dns, containerPort: 53, protocol: UDP}
        - {name: dns-tcp, containerPort: 53, protocol: TCP}
        - {name: metrics, containerPort: 9153}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
            add: [NET_BIND_SERVICE]
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
        readinessProbe:
          httpGet: {path: /ready, port: 8181}
        livenessProbe:
          httpGet: {path: /health, port: 8080}
        volumeMounts:
        - {name: config, mountPath: /etc/coredns, readOnly: true}
      volumes:
      - name: config
        configMap:
          name: lab-dns
---
apiVersion: v1
kind: Service
metadata:
  name: lab-dns
  namespace: dns-system
  annotations:
    metallb.io/loadBalancerIPs: 192.168.1.6
    metallb.io/address-pool: lab-reserved
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Local
  loadBalancerSourceRanges: [192.168.1.0/24, 192.168.32.0/24]
  selector:
    app: lab-dns
  ports:
  - {name: dns, port: 53, targetPort: dns, protocol: UDP}
  - {name: dns-tcp, port: 53, targetPort: dns-tcp, protocol: TCP}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: lab-dns
  namespace: dns-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: lab-dns
