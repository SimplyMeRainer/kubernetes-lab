apiVersion: v1
kind: ServiceAccount
metadata:
  name: staging-deployer
  namespace: cicd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: training-web-deployer
  namespace: staging
rules:
- apiGroups: [apps]
  resources: [deployments]
  resourceNames: [training-web]
  verbs: [get, watch, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: training-web-deployer
  namespace: staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: training-web-deployer
subjects:
- kind: ServiceAccount
  name: staging-deployer
  namespace: cicd
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: staging-delivery-smoke
  namespace: cicd
spec:
  description: Validate a permitted staging deployment change, deploy, wait for readiness, and test HTTP. No production privileges.
  tasks:
  - name: validate-deploy-test
    taskSpec:
      steps:
      - name: validate
        image: registry.k8s.io/kubectl:v1.35.8
        command: [kubectl]
        args: [patch, deployment, training-web, -n, staging, --type=merge, '-p={"spec":{"replicas":2}}', --dry-run=server]
      - name: deploy
        image: registry.k8s.io/kubectl:v1.35.8
        command: [kubectl]
        args: [patch, deployment, training-web, -n, staging, --type=merge, '-p={"spec":{"replicas":2}}']
      - name: rollout
        image: registry.k8s.io/kubectl:v1.35.8
        command: [kubectl]
        args: [rollout, status, deployment/training-web, -n, staging, --timeout=180s]
      - name: smoke-http
        image: curlimages/curl:8.16.0
        command: [curl]
        args: [--fail, --silent, --show-error, --retry-connrefused, --connect-timeout, "5", --max-time, "30", --retry, "5", --retry-delay, "2", 'http://training-web.staging.svc.cluster.local:8080/']
